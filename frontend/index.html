<!DOCTYPE html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- WARNING: this inline script and the one further down are allowed by the CSP
         (vercel.json) via the SHA-256 hash of their exact contents. If you change the text of
         EITHER <script>, recompute the hash (`npm run build`, then base64 sha256 of the tag's
         contents) and update both 'sha256-...' values in vercel.json → headers →
         Content-Security-Policy → script-src. Otherwise the browser silently blocks the
         script and the page flashes the default theme on every load. -->
    <script>
      /* Apply the theme and layout before first paint, so the default never flashes.
         On phones only the iOS themes are offered; 'auto' follows the phone's own setting. */
      try {
        var t;
        if (matchMedia('(max-width: 640px)').matches) {
          var mp = localStorage.getItem('albert-theme-mobile') || 'auto';
          t = (mp === 'ios-dark' || mp === 'ios-light' || mp === 'brown-leather') ? mp
            : (matchMedia('(prefers-color-scheme: dark)').matches ? 'ios-dark' : 'ios-light');
        } else {
          t = localStorage.getItem('albert-theme') || 'black-leather';
        }
        document.documentElement.setAttribute('data-theme', t);
        /* Tint Safari's top bar to match the theme background, so the notch blends in */
        var BG = { 'ios-dark': '#000000', 'ios-light': '#F2F2F7', 'black-leather': '#121211',
                   'brown-leather': '#120E0B', 'cream': '#EFE9DD', 'original': '#1E1B18' };
        var m = document.createElement('meta');
        m.setAttribute('name', 'theme-color');
        m.setAttribute('content', BG[t] || '#000000');
        document.head.appendChild(m);
      } catch (e) {}
      try { document.documentElement.setAttribute('data-layout', localStorage.getItem('albert-layout') || 'classic') } catch (e) {}
      /* Launched from the home screen (standalone): Safari's bottom bar is absent, so mark
         it and let the tab bar dock to the edge instead of floating over the gesture area. */
      try { if (navigator.standalone || matchMedia('(display-mode: standalone)').matches) document.documentElement.setAttribute('data-standalone', '') } catch (e) {}
      /* Pick the PWA manifest SYNCHRONOUSLY here, before Safari reads it: the helper page
         (/tasks/h) gets its own manifest (start_url = that person's link), everything else
         gets the dashboard's. Swapping it from React (useEffect) happened too late — iOS had
         already taken the dashboard manifest (start_url '/'), so the installed helper app
         opened the account sign-in instead of the PIN screen. */
      try {
        var isHelper = location.pathname.indexOf('/tasks/h') === 0;
        var mf = document.createElement('link');
        mf.setAttribute('rel', 'manifest');
        if (isHelper) {
          var slug = new URLSearchParams(location.search).get('u') || '';
          mf.setAttribute('href', '/api/tasks/manifest?u=' + encodeURIComponent(slug));
          var ti = document.createElement('meta');
          ti.setAttribute('name', 'apple-mobile-web-app-title');
          ti.setAttribute('content', 'Задачи');
          document.head.appendChild(ti);
        } else {
          mf.setAttribute('href', '/manifest.json');
          var ti = document.createElement('meta');
          ti.setAttribute('name', 'apple-mobile-web-app-title');
          ti.setAttribute('content', 'RedLava');
          document.head.appendChild(ti);
        }
        document.head.appendChild(mf);
      } catch (e) {}
    </script>
    <!-- Favicon: the same monogram as the app icon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Home-screen app icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover: content fills the screen, running under the Dynamic Island / notch -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Installed as a PWA: full screen, with the status bar over the content -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>RedLava</title>
    <style>
      /* iOS will not let a home-screen app lock its orientation (manifest.orientation is
         ignored). So in the INSTALLED app a landscape turn shows a "rotate upright" notice
         rather than letting the layout fall apart. An ordinary Safari tab never sees it,
         because data-standalone is absent there. */
      .rotate-guard { display: none; }
      @media (orientation: landscape) and (max-height: 480px) {
        html[data-standalone] .rotate-guard {
          display: flex; position: fixed; inset: 0; z-index: 100000;
          flex-direction: column; align-items: center; justify-content: center; gap: 14px;
          text-align: center; padding: 24px;
          background: var(--bg-app, #121211); color: var(--text-secondary, #9ca3af);
        }
        html[data-standalone] .rotate-guard svg { color: var(--accent, #8FB2D4); }
        html[data-standalone] .rotate-guard p { margin: 0; font-size: 16px; font-weight: 600; color: var(--text-primary, #e2e8f0); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="rotate-guard" aria-hidden="true">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>
      </svg>
      <!-- Static HTML outside React: the wording is chosen by browser language below -->
      <p data-rotate-msg>Please rotate your phone upright</p>
    </div>
    <script>
      // The "rotate your phone" notice lives outside React (it shows before the bundle
      // loads), so the language comes from the saved choice, falling back to the browser locale.
      (function () {
        try {
          var saved = localStorage.getItem('redlava-lang')
          var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || '']
          var ru = saved ? saved === 'ru' : langs.some(function (l) { return String(l).toLowerCase().indexOf('ru') === 0 })
          if (ru) {
            var el = document.querySelector('[data-rotate-msg]')
            if (el) el.textContent = 'Поверните телефон вертикально'
          }
        } catch (e) { /* keep the English wording already in the markup */ }
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
