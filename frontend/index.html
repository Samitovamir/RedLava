<!DOCTYPE html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* Применяем тему и раскладку до отрисовки — без мелькания дефолта.
         На телефоне — только iOS-темы; 'auto' следует за оформлением телефона. */
      try {
        var t;
        if (matchMedia('(max-width: 640px)').matches) {
          var mp = localStorage.getItem('albert-theme-mobile') || 'auto';
          t = (mp === 'ios-dark' || mp === 'ios-light' || mp === 'brown-leather') ? mp
            : (matchMedia('(prefers-color-scheme: dark)').matches ? 'ios-dark' : 'ios-light');
        } else {
          t = localStorage.getItem('albert-theme') || 'black-leather';
        }
        document.documentElement.setAttribute('data-theme', t);
        /* Тонируем верхнюю полосу Safari под фон темы, чтобы «чёлка» сливалась с сайтом */
        var BG = { 'ios-dark': '#000000', 'ios-light': '#F2F2F7', 'black-leather': '#121211',
                   'brown-leather': '#120E0B', 'cream': '#EFE9DD', 'original': '#1E1B18' };
        var m = document.createElement('meta');
        m.setAttribute('name', 'theme-color');
        m.setAttribute('content', BG[t] || '#000000');
        document.head.appendChild(m);
      } catch (e) {}
      try { document.documentElement.setAttribute('data-layout', localStorage.getItem('albert-layout') || 'classic') } catch (e) {}
      /* Запущено «с экрана Домой» (standalone): нет панели Safari снизу — помечаем,
         чтобы нижнее меню доковалось к краю и не висело над чёрной зоной жеста. */
      try { if (navigator.standalone || matchMedia('(display-mode: standalone)').matches) document.documentElement.setAttribute('data-standalone', '') } catch (e) {}
      /* Манифест PWA выбираем СИНХРОННО здесь, до того как Safari его прочитает: на странице
         помощника (/tasks/h) — личный манифест (start_url = его ссылка), иначе — дашборда.
         Раньше манифест подменялся из React (useEffect) слишком поздно: iOS успевал взять
         дашбордовский (start_url '/'), и установленное приложение помощника открывало вход
         пользователя вместо PIN-экрана. */
      try {
        var isHelper = location.pathname.indexOf('/tasks/h') === 0;
        var mf = document.createElement('link');
        mf.setAttribute('rel', 'manifest');
        if (isHelper) {
          var slug = new URLSearchParams(location.search).get('u') || '';
          mf.setAttribute('href', '/api/tasks/manifest?u=' + encodeURIComponent(slug));
          var ti = document.createElement('meta');
          ti.setAttribute('name', 'apple-mobile-web-app-title');
          ti.setAttribute('content', 'Задачи');
          document.head.appendChild(ti);
        } else {
          mf.setAttribute('href', '/manifest.json');
          var ti = document.createElement('meta');
          ti.setAttribute('name', 'apple-mobile-web-app-title');
          ti.setAttribute('content', 'RedLava');
          document.head.appendChild(ti);
        }
        document.head.appendChild(mf);
      } catch (e) {}
    </script>
    <!-- Favicon: монограмма AS (как и иконка приложения) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Иконка приложения на экране «Домой»: монограмма AS (пользователь Самитов) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover: контент во весь экран, под Dynamic Island/«чёлку» (без полей-рамки) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- На домашнем экране (PWA): полноэкранно, статус-бар поверх контента -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>RedLava</title>
    <style>
      /* iOS не даёт залочить ориентацию для home-screen приложения (manifest.orientation
         игнорируется). Поэтому в УСТАНОВЛЕННОМ приложении при повороте в ландшафт показываем
         подсказку «поверните вертикально» — контент не разъезжается. В обычной вкладке Safari
         заглушки нет (data-standalone отсутствует). */
      .rotate-guard { display: none; }
      @media (orientation: landscape) and (max-height: 480px) {
        html[data-standalone] .rotate-guard {
          display: flex; position: fixed; inset: 0; z-index: 100000;
          flex-direction: column; align-items: center; justify-content: center; gap: 14px;
          text-align: center; padding: 24px;
          background: var(--bg-app, #121211); color: var(--text-secondary, #9ca3af);
        }
        html[data-standalone] .rotate-guard svg { color: var(--accent, #8FB2D4); }
        html[data-standalone] .rotate-guard p { margin: 0; font-size: 16px; font-weight: 600; color: var(--text-primary, #e2e8f0); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="rotate-guard" aria-hidden="true">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>
      </svg>
      <!-- Статический HTML вне React: подпись ставится по языку браузера -->
      <p data-rotate-msg>Please rotate your phone upright</p>
    </div>
    <script>
      // Подпись «поверните телефон» живёт вне React (показывается до загрузки бандла),
      // поэтому язык берём из сохранённого выбора, иначе — из локали браузера.
      (function () {
        try {
          var saved = localStorage.getItem('redlava-lang')
          var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || '']
          var ru = saved ? saved === 'ru' : langs.some(function (l) { return String(l).toLowerCase().indexOf('ru') === 0 })
          if (ru) {
            var el = document.querySelector('[data-rotate-msg]')
            if (el) el.textContent = 'Поверните телефон вертикально'
          }
        } catch (e) { /* оставляем английский вариант из разметки */ }
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
