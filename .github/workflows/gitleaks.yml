name: Secret scan

# Scans every push and PR for anything that looks like a committed secret
# (API keys, tokens, private keys). Full history on push to main so a secret
# that slipped into an older commit still gets caught.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
